name = "fixed_fractional"
title = "Fixed Fractional Sizing"
family = "size"
version = "1.0.0"
strategy = "vyapaar_strategies.strategies.sizing:FixedFractional"

[params.instrument]
default = "NSE:RELIANCE-EQ"

[params.notional]
default = 100000
min = 1000
max = 100000000
step = 1000

[params.risk_percent]
default = "1"
min = "0.1"
max = "10"
step = "0.1"

[params.stop_distance]
default = "5"
min = "0.1"
max = "100"
step = "0.1"

[params.fast_period]
default = 10
min = 2
max = 50
step = 1

[params.slow_period]
default = 30
min = 5
max = 100
step = 5
