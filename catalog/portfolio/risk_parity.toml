name = "risk_parity"
title = "Risk Parity"
family = "portfolio"
version = "1.0.0"
strategy = "vyapaar_strategies.strategies.risk_parity:RiskParity"

[params.instruments]
default = "NSE:NIFTY50-INDEX,NSE:BANKNIFTY-INDEX"

[params.lookback]
default = 20
min = 2
max = 100
step = 1

[params.rebalance_period]
default = 5
min = 1
max = 50
step = 1

[params.notional]
default = 100000
min = 1000
max = 100000000
step = 1000
