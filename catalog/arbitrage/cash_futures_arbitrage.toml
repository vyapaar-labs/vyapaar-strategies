name = "cash_futures_arbitrage"
title = "Cash-Futures Arbitrage"
family = "arbitrage"
version = "1.0.0"
strategy = "vyapaar_strategies.strategies.arbitrage:CashFuturesArbitrage"

[params.cash_instrument]
default = "NSE:RELIANCE-EQ"

[params.futures_instrument]
default = "NFO:RELIANCE24DECFUT"

[params.entry_threshold]
default = "0.50"
min = "0.05"
max = "50.00"
step = "0.05"

[params.exit_threshold]
default = "0.10"
min = "0.00"
max = "50.00"
step = "0.05"

[params.quantity]
default = 10
min = 1
max = 1000
step = 1
