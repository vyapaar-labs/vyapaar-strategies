name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python gate (ruff / mypy / pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pydantic
      - name: Lint (ruff)
        run: ruff check . && ruff format --check .
      - name: Type check (mypy)
        run: mypy vyapaar_strategies
      - name: Tests (pytest)
        run: pytest -q
